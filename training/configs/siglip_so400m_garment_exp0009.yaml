# ============================================================
# AURA-GARMENT-V1 REPRODUCIBLE TRAINING CONFIGURATION
# Experiment: garment-exp-0009
# Model: Genuine Pretrained SigLIP-SO400M + 512-dim Intermediate Probe
# Hypothesis: 512-dim bottleneck provides better capacity/generalization tradeoff than 256 and 1152
# Hardware: NVIDIA GeForce GTX 1650 (4GB VRAM) / CUDA 12.6
# ============================================================

experiment:
  id: "garment-exp-0009"
  name: "aura-garment-v1-siglip-so400m-512-intermediate-probe"
  seed: 42
  description: "Intermediate 512-dim bottleneck linear probe: 1152->512, dropout 0.3, weight_decay 0.05. Tests generalization/capacity tradeoff vs Exp-0007 (1152) and Exp-0008 (256)."

model:
  base_architecture: "google/siglip-so400m-patch14-384"
  canonical_taxonomy_path: "data/garment/metadata/canonical_taxonomy.json"
  freeze_backbone: true
  hidden_dim: 1152      # SigLIP-SO400M embedding dimension (frozen)
  bottleneck_dim: 512    # Intermediate compressed projection dimension (512-dim)
  head_dropout: 0.3      # Regularization dropout
  use_lora: false

dataset:
  manifest_path: "data/garment/metadata/dataset-v0.3.json"
  canonical_taxonomy_path: "data/garment/metadata/canonical_taxonomy.json"
  version: "0.3.0"
  image_size: 384
  num_workers: 2
  allowed_splits: ["train", "validation"]
  isolated_test_splits: ["blind_test", "hard_test", "real_world_test"]

training:
  device: "cuda"
  mixed_precision: "fp16"
  batch_size: 8
  gradient_accumulation_steps: 1
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.05
  optimizer: "AdamW"
  scheduler: "cosine"
  early_stopping_patience: 15

loss_weights:
  category_loss: 1.0
  fit_loss: 0.8
  silhouette_loss: 0.6
  color_loss: 0.8
  pattern_loss: 0.5
  material_loss: 0.6
  formality_loss: 0.4

output:
  runs_dir: "training/runs"
  save_best_only: false
  export_onnx: false
