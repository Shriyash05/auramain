# ============================================================
# AURA-GARMENT-V1 REPRODUCIBLE TRAINING CONFIGURATION
# Experiment: garment-exp-0016
# Model: Genuine Pretrained SigLIP-SO400M + Selective LoRA (Last 4 Blocks) + 256-dim Head
# Dataset: Frozen dataset-v0.5-500.json (N=500, Train=459, Val=41)
# System Hypothesis: Combining selective LoRA representation adaptation with garment-focused input (localized crops) resolves multi-garment wardrobe recognition
# Hardware: NVIDIA GeForce GTX 1650 (4GB VRAM) / CUDA 12.6
# ============================================================

experiment:
  id: "garment-exp-0016"
  name: "aura-garment-v1-siglip-so400m-exp0016-selective-lora-localization"
  seed: 42
  description: "Phase 14 system experiment: Selective LoRA on last 4 SigLIP transformer blocks (layers 23-26, r=8, a=16) with garment-focused input and 256-dim bottleneck head on dataset-v0.5-500."

model:
  base_architecture: "google/siglip-so400m-patch14-384"
  canonical_taxonomy_path: "data/garment/metadata/canonical_taxonomy.json"
  freeze_backbone: false
  use_lora: true
  lora_num_layers: 4
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "v_proj"]
  hidden_dim: 1152      # SigLIP-SO400M embedding dimension
  bottleneck_dim: 256    # 256-dim regularized bottleneck probe
  head_dropout: 0.3      # Head dropout
  unfreeze_last_n_layers: 0

dataset:
  manifest_path: "data/garment/metadata/dataset-v0.5-500.json"
  canonical_taxonomy_path: "data/garment/metadata/canonical_taxonomy.json"
  version: "0.5.0"
  image_size: 384
  num_workers: 0
  allowed_splits: ["train", "validation"]
  isolated_test_splits: ["blind_test", "hard_test", "real_world_test"]

training:
  device: "cuda"
  mixed_precision: "fp16"
  batch_size: 1          # Batch size 1 with grad accum 16 for safe 4GB VRAM execution
  gradient_accumulation_steps: 16
  epochs: 20             # Max 20 epochs
  max_hours: 8.0         # Hard safety limit
  learning_rate: 0.0005  # Probe head learning rate
  lora_learning_rate: 0.0002 # LoRA backbone adapter learning rate
  weight_decay: 0.05     # L2 regularization
  optimizer: "AdamW"
  scheduler: "cosine"
  early_stopping_patience: 6

loss_weights:
  category_loss: 1.0
  fit_loss: 1.0
  silhouette_loss: 1.0
  color_loss: 1.0
  pattern_loss: 1.0
  material_loss: 1.0
  formality_loss: 1.0

output:
  runs_dir: "training/runs"
  save_best_only: false
  export_onnx: false
