# ============================================================
# AURA-GARMENT-V1 TRAINING CONFIGURATION
# Model: SigLIP-SO400M + Multi-Task Classification Heads
# Experiment: garment-exp-0001
# ============================================================

experiment:
  id: "garment-exp-0001"
  name: "aura-garment-v1-siglip-multitask-heads"
  seed: 42
  description: "Frozen SigLIP backbone with multi-task classification heads for category, fit, silhouette, pattern, and formality"

model:
  base_architecture: "google/siglip-so400m-patch14-384"
  freeze_backbone: true
  use_lora: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  num_categories: 5
  num_fits: 6
  num_silhouettes: 8
  num_color_families: 17
  num_patterns: 9
  num_materials: 12

dataset:
  manifest_path: "data/garment/metadata/dataset-v0.1.json"
  version: "0.1.0"
  image_size: 384
  num_workers: 2

training:
  device: "cuda" # Auto-falls back to CPU if CUDA unavailable
  mixed_precision: "fp16" # Crucial for 4GB VRAM (GTX 1650)
  batch_size: 4          # Sized for 4GB VRAM budget
  gradient_accumulation_steps: 4 # Effective batch size = 16
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: "AdamW"
  scheduler: "cosine"
  early_stopping_patience: 4

loss_weights:
  category_loss: 1.0
  fit_loss: 0.8
  silhouette_loss: 0.6
  color_loss: 0.8
  pattern_loss: 0.5
  material_loss: 0.5
  formality_loss: 0.4

output:
  checkpoint_dir: "training/checkpoints/garment-exp-0001"
  save_best_only: true
  export_onnx: true
  onnx_output_path: "training/checkpoints/garment-exp-0001/aura-garment-v1.onnx"
